<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- Reference path -->
  <path d="M 40 340 C 180 340, 220 120, 400 100 C 480 92, 540 110, 600 70" fill="none" stroke="#444" stroke-width="3"/>
  <text x="44" y="362" font-size="14" fill="#444">Reference path</text>

  <!-- Lookahead circle around robot -->
  <circle cx="260" cy="300" r="90" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="300" y="396" font-size="14" fill="#6b7785">Lookahead circle (radius = L)</text>

  <!-- Line from lookahead circle edge to center illustrating L -->
  <line x1="260" y1="300" x2="260" y2="210" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="266" y="255" font-size="13" fill="#6b7785">L</text>

  <!-- Robot body -->
  <circle cx="260" cy="300" r="14" fill="#2b6cb0"/>
  <text x="222" y="330" font-size="14" font-weight="bold" fill="#1a365d">Robot</text>

  <!-- Heading arrow -->
  <line x1="260" y1="300" x2="260" y2="230" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="266" y="222" font-size="13" fill="#2b6cb0">heading</text>

  <!-- Goal point on path (intersection of lookahead circle and path) -->
  <circle cx="314" cy="217" r="7" fill="#c0392b"/>
  <text x="322" y="214" font-size="14" font-weight="bold" fill="#8a2c20">Goal point</text>

  <!-- Chord from robot to goal point -->
  <line x1="260" y1="300" x2="314" y2="217" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Alpha angle arc between heading and chord -->
  <path d="M 260 265 A 35 35 0 0 1 282 273" fill="none" stroke="#17824e" stroke-width="2"/>
  <text x="286" y="268" font-size="14" fill="#17824e">&#945;</text>

  <!-- ICC and radius R construction -->
  <circle cx="430" cy="300" r="5" fill="#333"/>
  <text x="438" y="300" font-size="13" fill="#333">ICC (instantaneous center of curvature)</text>
  <line x1="430" y1="300" x2="260" y2="300" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="430" y1="300" x2="314" y2="217" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="340" y="292" font-size="13" fill="#333">R</text>
  <text x="372" y="245" font-size="13" fill="#333">R</text>

  <!-- Arc path the robot will follow -->
  <path d="M 260 300 A 170 170 0 0 1 314 217" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="258" y="360" font-size="13" fill="#8a2c20">Arc of curvature &#954; = 2sin(&#945;)/L driven to reach goal point</text>

  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1a1a1a">Pure Pursuit: lookahead point and curvature</text>
</svg>
